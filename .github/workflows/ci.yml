name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: pdo_pgsql, redis, pcntl, intl, bcmath, zip

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Pint (formatting, read-only)
        run: vendor/bin/pint --test
      - name: Larastan (level max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beauty
          POSTGRES_PASSWORD: beauty
          POSTGRES_DB: beauty_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beauty -d beauty_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: beauty_app
      DB_PASSWORD: beauty_app
      DB_OWNER_USERNAME: beauty
      DB_OWNER_PASSWORD: beauty
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
      - uses: ramsey/composer-install@v4
      - name: Create the application database role
        run: psql -h 127.0.0.1 -U beauty -d beauty_test -v ON_ERROR_STOP=1 -f docker/postgres/01-roles.sql
        env:
          PGPASSWORD: beauty
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Test with coverage
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history for secrets
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - name: Audit dependencies
        run: composer audit --locked
      - name: gitleaks
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.14.0 < Dockerfile

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: false
          tags: beauty-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
