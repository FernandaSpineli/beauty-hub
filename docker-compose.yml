name: beauty-hub

# Credentials below are for local development only.
x-app: &app
    build:
        context: .
        target: prod
    image: beauty-hub:dev
    env_file: .env
    environment:
        DB_HOST: postgres
        DB_PORT: 5432
        REDIS_HOST: redis
        REDIS_PORT: 6379
        MAIL_HOST: mailpit
        MAIL_PORT: 1025

services:
    # Applies database migrations once, before the API starts.
    migrate:
        <<: *app
        command: ["php", "artisan", "migrate", "--force", "--database=owner"]
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"

    app:
        <<: *app
        ports:
            - "${FORWARD_APP_PORT:-8000}:8000"
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/up"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    # Queue workers (Redis), supervised by Horizon.
    horizon:
        <<: *app
        command: ["php", "artisan", "horizon"]
        healthcheck:
            test: ["CMD", "php", "artisan", "horizon:status"]
            interval: 30s
            timeout: 10s
            retries: 3
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        restart: unless-stopped

    # Runs scheduled tasks (order expiry, expiry alerts, cleanups).
    scheduler:
        <<: *app
        command: ["php", "artisan", "schedule:work"]
        # The base image's check probes the web server, which this
        # container does not run.
        healthcheck:
            disable: true
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        restart: unless-stopped

    # Composer, tests and static analysis against the mounted source:
    #   docker compose run --rm dev composer install
    dev:
        build:
            context: .
            target: dev
        image: beauty-hub:tools
        profiles: ["dev"]
        user: "${UID:-1000}:${GID:-1000}"
        volumes:
            - .:/app
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            REDIS_HOST: redis
            REDIS_PORT: 6379
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Forwards Stripe test-mode events (platform and connected accounts) to
    # the webhook:
    #   docker compose --profile stripe up -d
    #   docker compose logs stripe   # "Your webhook signing secret is whsec_..."
    stripe:
        image: stripe/stripe-cli:v1.53.0
        profiles: ["stripe"]
        command:
            - listen
            - --forward-to=http://app:8000/api/v1/stripe/webhook
            - --forward-connect-to=http://app:8000/api/v1/stripe/webhook
        environment:
            STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
        depends_on:
            - app

    # Catches every email the app sends: http://localhost:8025
    mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
            - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: beauty
            POSTGRES_PASSWORD: beauty
            POSTGRES_DB: beauty
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql
            - ./docker/postgres:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U beauty -d beauty"]
            interval: 5s
            timeout: 3s
            retries: 10

    redis:
        image: redis:8-alpine
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
